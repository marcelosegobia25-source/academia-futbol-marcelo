{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if partido else 'Programar' }} partido{% endblock %}
{% block contenido %}
<h2 class="mb-3">{{ 'Editar partido' if partido else 'Programar partido' }}</h2>
<form method="post" class="card shadow-sm p-4" style="max-width: 600px;">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Fecha</label>
            <input type="date" name="fecha" class="form-control" required value="{{ partido.fecha.isoformat() if partido else '' }}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Hora</label>
            <input type="time" name="hora" class="form-control" value="{{ partido.hora.strftime('%H:%M') if partido and partido.hora else '' }}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Equipo (propio)</label>
            <select name="id_equipo" class="form-select" required>
                {% for e in equipos %}<option value="{{ e.id_equipo }}" {% if partido and partido.id_equipo == e.id_equipo %}selected{% endif %}>{{ e.nombre }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Categoría</label>
            <select name="id_categoria" class="form-select" required>
                {% for c in categorias %}<option value="{{ c.id_categoria }}" {% if partido and partido.id_categoria == c.id_categoria %}selected{% endif %}>{{ c.nombre }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Rival</label>
            <input type="text" name="rival" class="form-control" required value="{{ partido.rival if partido else '' }}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Cancha / lugar</label>
            <input type="text" name="cancha" class="form-control" list="lugares-disponibles" value="{{ partido.cancha if partido else '' }}" placeholder="Seleccione o escriba un lugar">
        </div>
        <div class="col-md-6">
            <label class="form-label">Resultado (opcional)</label>
            <input type="text" name="resultado" class="form-control" placeholder="ej. 3-1" value="{{ partido.resultado if partido else '' }}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Campeonato (opcional)</label>
            <select name="id_campeonato" class="form-select">
                <option value="">Ninguno</option>
                {% for c in campeonatos %}<option value="{{ c.id_campeonato }}" {% if partido and partido.id_campeonato == c.id_campeonato %}selected{% endif %}>{{ c.nombre }}</option>{% endfor %}
            </select>
        </div>
    </div>
    <div class="mt-3 border rounded p-3"><div class="form-check"><input class="form-check-input" type="checkbox" name="autorizar_conflicto" value="1" id="autorizar-conflicto"><label class="form-check-label" for="autorizar-conflicto">Autorizar conflicto de horario (solo administrador)</label></div><input name="motivo_conflicto" maxlength="255" class="form-control mt-2" autocomplete="off" placeholder="Motivo obligatorio de la autorización"></div>
    <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('partidos.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
<datalist id="lugares-disponibles">
    {% for lugar in lugares %}<option value="{{ lugar.nombre }}">{{ lugar.tipo }}{% if lugar.direccion %} · {{ lugar.direccion }}{% endif %}</option>{% endfor %}
</datalist>
{% endblock %}
