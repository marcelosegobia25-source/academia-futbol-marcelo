<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - {{ marca.nombre_academia }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body class="bg-dark">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="card shadow-lg border-0" style="width: min(100%, 420px);">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    {% if marca.logo %}<img src="{{ url_for('configuracion.logo') }}" alt="Logo" width="88" class="mb-3">{% else %}<i class="bi bi-shield-check display-3 text-success"></i>{% endif %}
                    <h1 class="h3 mb-1">{{ marca.nombre_academia }}</h1>
                    <p class="text-muted mb-0">Ingrese la contraseña para acceder.</p>
                </div>
                {% with mensajes = get_flashed_messages(with_categories=true) %}
                    {% for categoria, mensaje in mensajes %}
                    <div class="alert alert-{{ 'danger' if categoria == 'danger' else categoria }}">{{ mensaje }}</div>
                    {% endfor %}
                {% endwith %}
                <form method="post" autocomplete="off">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="next" value="{{ destino }}">
                    <label for="nombre_usuario" class="form-label">Usuario</label>
                    <input id="nombre_usuario" name="nombre_usuario" class="form-control form-control-lg mb-3" value="admin" maxlength="40" required>
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input id="contrasena" name="contrasena" type="password"
                           class="form-control form-control-lg text-center"
                           inputmode="numeric" pattern="[0-9]{5}" minlength="5"
                           maxlength="5" autocomplete="current-password" required autofocus>
                    <div class="form-text">Debe contener exactamente 5 números.</div>
                    <button class="btn btn-success btn-lg w-100 mt-4" type="submit">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
