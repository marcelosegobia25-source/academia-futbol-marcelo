<div id="equipos-select" class="border rounded p-3">
    {% for eq in equipos %}
    <div class="form-check{% if not loop.last %} mb-2{% endif %}">
        <input class="form-check-input" type="checkbox" name="equipos"
               value="{{ eq.id_equipo }}" id="equipo-{{ eq.id_equipo }}"
               {% if eq.id_equipo in seleccionados %}checked{% endif %}>
        <label class="form-check-label" for="equipo-{{ eq.id_equipo }}">
            Equipo {{ eq.nombre }}
            <small class="text-muted">({{ eq.categoria.nombre if eq.categoria else 'todas las categorías' }})</small>
        </label>
    </div>
    {% else %}
    <span class="text-muted">No hay equipos registrados.</span>
    {% endfor %}
</div>
