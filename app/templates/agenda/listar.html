{% extends "base.html" %}
{% block titulo %}Agenda{% endblock %}
{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-journal-text"></i> Agenda</h2>
    <a href="{{ url_for('agenda.crear') }}" class="btn btn-success"><i class="bi bi-plus-lg"></i> Nuevo evento</a>
</div>
<form method="get" class="card card-body mb-3">
    <div class="row g-2 align-items-end">
        <div class="col-md-3"><label class="form-label">Fecha</label><input type="date" name="fecha" class="form-control" value="{{ filtros.get('fecha','') }}"></div>
        <div class="col-md-3"><label class="form-label">Categoría</label><select name="id_categoria" class="form-select"><option value="">Todas</option>{% for c in categorias %}<option value="{{ c.id_categoria }}" {% if filtros.get('id_categoria')|int == c.id_categoria %}selected{% endif %}>{{ c.nombre_mostrado }}</option>{% endfor %}</select></div>
        <div class="col-md-3"><label class="form-label">Equipo</label><select name="id_equipo" class="form-select"><option value="">Todos</option>{% for e in equipos %}<option value="{{ e.id_equipo }}" {% if filtros.get('id_equipo')|int == e.id_equipo %}selected{% endif %}>{{ e.nombre }}</option>{% endfor %}</select></div>
        <div class="col-md-2"><label class="form-label">Tipo</label><select name="tipo" class="form-select"><option value="">Todos</option>{% for tipo in ['Evento','Partido','Entrenamiento'] %}<option {% if filtros.get('tipo') == tipo %}selected{% endif %}>{{ tipo }}</option>{% endfor %}</select></div>
        <div class="col-md-1 d-grid gap-1"><button class="btn btn-dark"><i class="bi bi-funnel"></i></button><a href="{{ url_for('agenda.listar') }}" class="btn btn-outline-secondary btn-sm" title="Limpiar filtros"><i class="bi bi-x-lg"></i></a></div>
    </div>
</form>
<div id="tabla-agenda">{% include "agenda/_tabla.html" %}</div>
{% endblock %}
