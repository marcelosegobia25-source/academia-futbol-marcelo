{% extends 'base.html' %}{% block titulo %}Nueva compra{% endblock %}{% block contenido %}
<h1 class="page-title mb-4">Registrar compra de inventario</h1>
<form method="post" class="card card-body"><div class="row g-3 mb-3"><div class="col-md-4"><label class="form-label">Proveedor</label><select name="id_proveedor" class="form-select" required><option value="">Seleccione</option>{% for p in proveedores %}<option value="{{ p.id_proveedor }}">{{ p.nombre }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Fecha</label><input type="date" name="fecha" value="{{ hoy }}" class="form-control" required></div><div class="col-md-2"><label class="form-label">Factura</label><input name="numero_factura" maxlength="80" class="form-control" autocomplete="off"></div><div class="col-md-3"><label class="form-label">Método</label><select name="modo_pago" class="form-select">{% for m in modos %}<option>{{ m }}</option>{% endfor %}</select></div></div>
<div id="lineas"><div class="row g-2 linea mb-2"><div class="col-md-6"><select name="id_variante" class="form-select" required>{% for v in variantes %}<option value="{{ v.id_variante }}">{{ v.nombre_completo }}</option>{% endfor %}</select></div><div class="col-md-2"><input type="number" min="1" name="cantidad" value="1" class="form-control" required></div><div class="col-md-3"><input type="number" min="0" step="0.01" name="costo_unitario" class="form-control" placeholder="Costo unitario" required></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger quitar">×</button></div></div></div>
<button type="button" id="agregar" class="btn btn-sm btn-outline-primary mb-3">Añadir producto</button><input name="observacion" maxlength="255" class="form-control mb-3" placeholder="Observación"><div><button class="btn btn-success">Registrar compra completa</button> <a href="{{ url_for('gestion.compras') }}" class="btn btn-outline-secondary">Cancelar</a></div></form>
<script>(()=>{const c=document.getElementById('lineas');document.getElementById('agregar').onclick=()=>c.appendChild(c.firstElementChild.cloneNode(true));c.addEventListener('click',e=>{if(e.target.classList.contains('quitar')&&c.children.length>1)e.target.closest('.linea').remove()})})()</script>{% endblock %}
