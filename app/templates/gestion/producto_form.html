{% extends 'base.html' %}{% block titulo %}Nuevo producto{% endblock %}{% block contenido %}<h1 class="page-title mb-4">Nuevo producto</h1><form method="post" class="card p-4" style="max-width:860px"><div class="row g-3"><div class="col-md-4"><label>Código</label><input name="codigo" class="form-control" required></div><div class="col-md-8"><label>Nombre</label><input name="nombre" class="form-control" required></div><div class="col-md-6"><label>Categoría</label><input name="categoria" value="Uniformes" class="form-control"></div><div class="col-md-6"><label>Descripción</label><input name="descripcion" class="form-control"></div><div class="col-md-3"><label>Talla inicial</label><input name="talla" value="Única" class="form-control"></div><div class="col-md-3"><label>Color</label><input name="color" value="Estándar" class="form-control"></div><div class="col-md-2"><label>Compra</label><input type="number" min="0" step=".01" name="precio_compra" value="0" class="form-control"></div><div class="col-md-2"><label>Venta</label><input type="number" min="0" step=".01" name="precio_venta" value="0" class="form-control"></div><div class="col-md-2"><label>Stock inicial</label><input type="number" min="0" name="stock_inicial" value="0" class="form-control"></div><div class="col-md-2"><label>Stock mínimo</label><input type="number" min="0" name="stock_minimo" value="0" class="form-control"></div></div><p class="text-muted small mt-3 mb-0">La alerta desaparece cuando el stock queda por encima del mínimo configurado.</p><button class="btn btn-success mt-4">Guardar producto</button></form>{% endblock %}
