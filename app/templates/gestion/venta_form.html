{% extends 'base.html' %}{% block titulo %}Nueva venta{% endblock %}{% block contenido %}<h1 class="page-title mb-4">Nueva venta</h1><form method="post" class="card p-4"><div class="row g-3 mb-4"><div class="col-md-3"><label>Fecha</label><input type="date" name="fecha" value="{{hoy}}" class="form-control" required></div><div class="col-md-3"><label>Alumno</label><select name="id_alumno" class="form-select"><option value="">Persona externa</option>{% for a in alumnos %}<option value="{{a.id_alumno}}">{{a.nombre_completo}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Cliente externo</label><input name="cliente_externo" class="form-control"></div><div class="col-md-3"><label>Método</label><select name="modo_pago" class="form-select">{% for m in modos %}<option>{{m}}</option>{% endfor %}</select></div><div class="col-md-3"><label>N.º operación</label><input name="numero_operacion" class="form-control"></div><div class="col-md-3"><label>Descuento total</label><input type="number" step=".01" min="0" value="0" name="descuento" class="form-control"></div><div class="col-md-6"><label>Observación</label><input name="observacion" class="form-control"></div></div><h5>Productos</h5><div id="lineas-venta">{% for i in range(5) %}<div class="row g-2 mb-2"><div class="col-md-9"><select name="id_variante" class="form-select"><option value="">Seleccione producto</option>{% for v in variantes %}<option value="{{v.id_variante}}">{{v.nombre_completo}} · Stock {{v.stock}} · {{v.precio_venta}}</option>{% endfor %}</select></div><div class="col-md-3"><input type="number" min="1" name="cantidad" class="form-control" placeholder="Cantidad"></div></div>{% endfor %}</div><button class="btn btn-success mt-3">Registrar venta</button></form>{% endblock %}
