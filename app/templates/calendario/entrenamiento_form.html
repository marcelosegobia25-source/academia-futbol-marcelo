{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if entrenamiento else 'Nuevo' }} entrenamiento fijo{% endblock %}
{% block contenido %}
<h2 class="mb-3">{{ 'Editar' if entrenamiento else 'Nuevo' }} entrenamiento fijo</h2>
<form method="post" class="card shadow-sm p-4" style="max-width: 600px;">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Día de la semana</label>
            <select name="dia_semana" class="form-select" required>
                {% for i in range(7) %}<option value="{{ i }}" {% if entrenamiento and entrenamiento.dia_semana == i %}selected{% endif %}>{{ dias_semana[i] }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Hora inicio</label>
            <input type="time" name="hora_inicio" class="form-control" required value="{{ entrenamiento.hora_inicio.strftime('%H:%M') if entrenamiento else '' }}">
        </div>
        <div class="col-md-3">
            <label class="form-label">Hora fin</label>
            <input type="time" name="hora_fin" class="form-control" value="{{ entrenamiento.hora_fin.strftime('%H:%M') if entrenamiento and entrenamiento.hora_fin else '' }}">
        </div>
        <div class="col-md-6"><label class="form-label">Vigente desde</label><input type="date" name="fecha_inicio" class="form-control" value="{{ entrenamiento.fecha_inicio.isoformat() if entrenamiento and entrenamiento.fecha_inicio else '' }}"></div>
        <div class="col-md-6"><label class="form-label">Vigente hasta</label><input type="date" name="fecha_fin" class="form-control" value="{{ entrenamiento.fecha_fin.isoformat() if entrenamiento and entrenamiento.fecha_fin else '' }}"></div>
        <div class="col-md-6">
            <label class="form-label">Categoría</label>
            <select name="id_categoria" class="form-select">
                <option value="">-</option>
                {% for c in categorias %}<option value="{{ c.id_categoria }}" {% if entrenamiento and entrenamiento.id_categoria == c.id_categoria %}selected{% endif %}>{{ c.nombre }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Equipo</label>
            <select name="id_equipo" class="form-select">
                <option value="">-</option>
                {% for e in equipos %}<option value="{{ e.id_equipo }}" {% if entrenamiento and entrenamiento.id_equipo == e.id_equipo %}selected{% endif %}>{{ e.nombre }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-6"><label class="form-label">Entrenador responsable</label><select name="id_entrenador" class="form-select"><option value="">Sin asignar</option>{% for p in entrenadores %}<option value="{{ p.id_personal }}" {% if entrenamiento and entrenamiento.id_entrenador==p.id_personal %}selected{% endif %}>{{ p.nombre }}</option>{% endfor %}</select></div>
        <div class="col-12">
            <label class="form-label">Lugar</label>
            <input type="text" name="lugar" class="form-control" list="lugares-disponibles" placeholder="Seleccione o escriba un lugar" value="{{ entrenamiento.lugar if entrenamiento else '' }}">
        </div>
    </div>
    <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('calendario.listar_entrenamientos') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
<datalist id="lugares-disponibles">
    {% for lugar in lugares %}<option value="{{ lugar.nombre }}">{{ lugar.tipo }}{% if lugar.direccion %} · {{ lugar.direccion }}{% endif %}</option>{% endfor %}
</datalist>
{% endblock %}
