{% extends 'base.html' %}
{% block titulo %}Acceso denegado{% endblock %}
{% block contenido %}
<div class="card p-5 text-center mx-auto my-5" style="max-width: 580px; border-color: rgba(234, 179, 8, 0.25); box-shadow: 0 20px 45px -10px rgba(0,0,0,0.7), 0 0 25px rgba(234, 179, 8, 0.12);">
    <div class="hero-crest-placeholder mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2rem; border-color: rgba(234, 179, 8, 0.4); box-shadow: 0 0 25px rgba(234, 179, 8, 0.25);">
        <i class="bi bi-shield-lock text-warning"></i>
    </div>
    <span class="hero-badge mx-auto mb-2" style="border-color: rgba(234, 179, 8, 0.35); color: #facc15;">
        <i class="bi bi-lock-fill"></i> Error 403
    </span>
    <h2 class="mt-2 text-white fw-bold">Acceso Restringido</h2>
    <p class="text-muted mb-4">No dispone de los permisos o roles necesarios para ejecutar esta acción en el sistema.</p>
    <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('index') }}" class="btn btn-hero-secondary">
            <i class="bi bi-house-door me-1"></i> Volver al Inicio
        </a>
    </div>
</div>
{% endblock %}
