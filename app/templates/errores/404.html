{% extends "base.html" %}
{% block titulo %}Página no encontrada{% endblock %}
{% block contenido %}
<div class="card p-5 text-center mx-auto my-5" style="max-width: 580px; border-color: rgba(56, 189, 248, 0.2); box-shadow: 0 20px 45px -10px rgba(0,0,0,0.7), 0 0 25px rgba(56, 189, 248, 0.1);">
    <div class="hero-crest-placeholder mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2rem; border-color: rgba(56, 189, 248, 0.35); box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);">
        <i class="bi bi-search text-info"></i>
    </div>
    <span class="hero-badge mx-auto mb-2" style="border-color: rgba(56, 189, 248, 0.3); color: #38bdf8;">
        <i class="bi bi-compass"></i> Error 404
    </span>
    <h2 class="mt-2 text-white fw-bold">Página no encontrada</h2>
    <p class="text-muted mb-4">El enlace solicitado no existe, cambió de ubicación o fue archivado por el sistema.</p>
    <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('index') }}" class="btn btn-hero-secondary">
            <i class="bi bi-house-door me-1"></i> Volver al Centro de Mando
        </a>
    </div>
</div>
{% endblock %}
