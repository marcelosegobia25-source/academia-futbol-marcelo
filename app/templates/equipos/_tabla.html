<div class="card shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Nombre del equipo</th><th>Categoría</th><th>Alumnos</th><th></th></tr></thead>
            <tbody>
                {% for e in equipos %}
                <tr>
                    <td>{{ e.nombre }}</td>
                    <td>{{ e.categoria.nombre if e.categoria else 'Todas' }}</td>
                    <td>{{ e.alumnos | length }}</td>
                    <td class="text-end">
                        <a href="{{ url_for('equipos.editar', id_equipo=e.id_equipo) }}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                        <form method="post" action="{{ url_for('equipos.eliminar', id_equipo=e.id_equipo) }}" class="d-inline" onsubmit="return confirm('¿Eliminar este equipo?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="text-center text-muted py-4">No hay equipos registrados.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
